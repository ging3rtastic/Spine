<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Spine</title>
<meta name="description" content="Scan or search a book and track your shelves: To Read, Reading, Read." />
<meta name="theme-color" content="#131F1B" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spine" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #131F1B;
    --surface: #1C2B25;
    --surface-alt: #233830;
    --border: #31473C;
    --gold: #C9A24B;
    --rust: #A8553D;
    --text: #F1EAD9;
    --text-muted: #93A399;
    --wood: #3D2B1E;
    --wood-edge: #5A3F2A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); overscroll-behavior-y: none; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    height: var(--app-height, 100dvh);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  input::placeholder { color: var(--text-muted); }

  .content { flex: 1; overflow-y: auto; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }

  .version-tag {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 12px;
    font-size: 10px; color: var(--text-muted); z-index: 5;
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 9px; cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .version-tag:active { opacity: 0.7; }
  .header { padding: 22px 20px 14px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.2px; }
  .header p { font-size: 13px; color: var(--text-muted); margin: 4px 0 0; }
  .icon-btn.settings-btn { padding: 8px; flex-shrink: 0; }

  .search-row { padding: 0 20px 16px; }
  .search-box { display: flex; gap: 8px; }
  .search-input-wrap {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px;
  }
  .search-input-wrap input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    padding: 11px 0; font-size: 14px; font-family: inherit;
  }
  .icon-btn {
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px;
    padding: 0 14px; color: var(--gold); cursor: pointer; display: flex; align-items: center;
  }
  .primary-btn {
    margin-top: 10px; width: 100%; background: var(--gold); border: none; border-radius: 10px;
    padding: 11px 0; color: #14201C; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .primary-btn:active { opacity: 0.85; }
  .secondary-btn {
    margin-top: 10px; width: 100%; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 0; color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .secondary-btn:active { opacity: 0.85; }

  .list { padding: 0 20px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 30px; text-align: center; color: var(--text-muted); gap: 10px; }
  .empty span { font-size: 14px; line-height: 1.5; }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); padding: 10px 0; }
  .status-line.error { color: var(--rust); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 10px; overflow: hidden;
  }
  .result-card { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-open {
    display: flex; gap: 12px; width: 100%; text-align: left; background: none; border: none; padding: 0;
    cursor: pointer; color: inherit; font-family: inherit;
  }
  .cover {
    width: 50px; height: 74px; object-fit: cover; border-radius: 3px; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .cover-fallback {
    width: 50px; height: 74px; border-radius: 3px; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-muted);
  }
  .result-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; }
  .result-author { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .result-desc { font-size: 12px; color: var(--text); opacity: 0.75; line-height: 1.5; margin: 6px 0; }
  .pill-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .result-card > .pill-row { margin-top: 0; }
  .pill {
    display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px;
    font-size: 11.5px; border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; font-family: inherit;
  }
  .pill.active { border-color: var(--gold); background: rgba(201,162,75,0.14); color: var(--gold); }
  .pill.danger { color: var(--rust); margin-left: auto; }

  /* Bookshelf: fixed-height face-out book tiles wrap into rows; the wood ledge under every row is
     one repeating background on the container, sized to repeat once per (item height + row-gap).
     Each tile's cover(120px)+ledge-space(14px)+caption(~34px) = 168px is baked into the item itself,
     so — unlike a trailing-gap approach — the last row's ledge always has room to render. */
  .shelf-case {
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 14px 10px;
    background: repeating-linear-gradient(to bottom,
      transparent 0, transparent 120px,
      var(--wood-edge) 120px, var(--wood-edge) 122px,
      var(--wood) 122px, var(--wood) 134px,
      transparent 134px, transparent 182px);
  }
  .shelf-item {
    width: 80px; height: 168px; flex-shrink: 0;
    border: none; background: none; cursor: pointer; font-family: inherit; padding: 0;
    display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    transition: transform 120ms ease;
  }
  .shelf-item:active { transform: translateY(-4px); }
  @media (prefers-reduced-motion: reduce) {
    .shelf-item { transition: none; }
    .shelf-item:active { transform: none; }
  }
  .shelf-cover {
    width: 80px; height: 120px; object-fit: cover; border-radius: 2px; flex-shrink: 0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }
  .shelf-cover-fallback { display: flex; align-items: center; justify-content: center; color: rgba(241,234,217,0.8); }
  .shelf-item-title {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 12px; color: var(--text);
    margin-top: 18px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .shelf-item-author {
    font-size: 10.5px; color: var(--text-muted); margin-top: 2px;
    width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; padding: 6px 0; color: var(--text-muted); font-family: inherit;
  }
  .tab-btn.active { color: var(--gold); }
  .tab-btn span { font-size: 10.5px; font-weight: 500; }


  .scanner-overlay {
    position: absolute; inset: 0; background: rgba(10,15,13,0.97); z-index: 20;
    display: flex; flex-direction: column;
  }
  .scanner-close-row { display: flex; justify-content: flex-end; padding: 14px; }
  .scanner-close {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 8px;
    color: var(--text); cursor: pointer; display: flex;
  }
  .scanner-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .scanner-frame { position: relative; width: 100%; max-width: 320px; border-radius: 12px; overflow: hidden; border: 2px solid var(--gold); }
  .scanner-frame video { width: 100%; display: block; }
  .scanner-msg { text-align: center; color: var(--text-muted); max-width: 280px; }
  .scanner-msg p { font-size: 13.5px; line-height: 1.6; }
  .scanner-hint { text-align: center; color: var(--text-muted); font-size: 12.5px; padding-bottom: 24px; }

  .detail-body { flex: 1; overflow-y: auto; padding: 8px 20px 28px; }
  .detail-cover { display: block; width: 120px; height: 176px; object-fit: cover; border-radius: 6px;
    margin: 0 auto 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
  .detail-cover-fallback { width: 120px; height: 176px; border-radius: 6px; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--text-muted); }
  .detail-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; text-align: center; margin: 0 0 2px; }
  .detail-subtitle { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--text-muted);
    text-align: center; margin: 0 0 6px; }
  .detail-author { font-size: 13.5px; color: var(--text-muted); text-align: center; margin: 0 0 10px; }
  .detail-meta { font-size: 12px; color: var(--text-muted); text-align: center; margin: 0 0 10px; }
  .detail-rating { text-align: center; color: var(--gold); font-size: 14px; margin: 0 0 14px; }
  .detail-rating span { color: var(--text-muted); font-size: 12px; margin-left: 4px; }
  .detail-desc { font-size: 13.5px; color: var(--text); opacity: 0.9; line-height: 1.6; margin: 0 0 18px; white-space: pre-wrap; }
  .detail-desc-empty { opacity: 0.5; font-style: italic; }
  .detail-link { display: block; text-align: center; font-size: 12.5px; color: var(--gold); margin-top: 14px; text-decoration: none; }

  .settings-body { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
  .settings-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 18px; }
  .settings-section { margin-bottom: 26px; }
  .settings-section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 0 0 8px; }
  .settings-hint { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: 0 0 12px; }
  .settings-actions { display: flex; flex-direction: column; gap: 8px; }
  .settings-actions .primary-btn, .settings-actions .secondary-btn { margin-top: 0; }
  .sync-code-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sync-code { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 15px; letter-spacing: 0.04em; color: var(--gold); }
  .sync-status { font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px; }
  .sync-join-row { display: flex; gap: 8px; margin-top: 10px; }
  .sync-join-row input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; color: var(--text); font-size: 14px; font-family: inherit; }

  .stats-body { flex: 1; overflow-y: auto; padding: 0 20px 28px; }
  .stats-scope-row { margin-bottom: 22px; }
  .stat-tiles { display: flex; gap: 10px; margin-bottom: 26px; }
  .stat-tile {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 12px; text-align: center;
  }
  .stat-number { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; color: var(--gold); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .stats-genre-list { display: flex; flex-direction: column; gap: 8px; }
  .stats-genre-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 13.5px;
  }
  .stats-genre-count { color: var(--text-muted); font-size: 12.5px; }
  .stats-fact { font-size: 13px; color: var(--text-muted); margin-top: 22px; line-height: 1.5; }
  .stats-fact strong { color: var(--text); font-weight: 600; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
