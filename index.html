<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Spine</title>
<meta name="description" content="Scan or search a book and track your shelves: To Read, Reading, Read." />
<meta name="theme-color" content="#131F1B" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spine" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #131F1B;
    --surface: #1C2B25;
    --surface-alt: #233830;
    --border: #31473C;
    --gold: #C9A24B;
    --rust: #A8553D;
    --text: #F1EAD9;
    --text-muted: #93A399;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); overscroll-behavior-y: none; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    height: var(--app-height, 100dvh);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  input::placeholder { color: var(--text-muted); }

  .content { flex: 1; overflow-y: auto; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }

  .version-tag {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 12px;
    font-size: 10px; color: var(--text-muted); z-index: 5;
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 9px; cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .version-tag:active { opacity: 0.7; }
  .header { padding: 22px 20px 14px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.2px; }
  .header p { font-size: 13px; color: var(--text-muted); margin: 4px 0 0; }

  .search-row { padding: 0 20px 16px; }
  .search-box { display: flex; gap: 8px; }
  .search-input-wrap {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px;
  }
  .search-input-wrap input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    padding: 11px 0; font-size: 14px; font-family: inherit;
  }
  .icon-btn {
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px;
    padding: 0 14px; color: var(--gold); cursor: pointer; display: flex; align-items: center;
  }
  .primary-btn {
    margin-top: 10px; width: 100%; background: var(--gold); border: none; border-radius: 10px;
    padding: 11px 0; color: #14201C; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .primary-btn:active { opacity: 0.85; }

  .list { padding: 0 20px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 30px; text-align: center; color: var(--text-muted); gap: 10px; }
  .empty span { font-size: 14px; line-height: 1.5; }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); padding: 10px 0; }
  .status-line.error { color: var(--rust); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 10px; overflow: hidden;
  }
  .result-card { padding: 12px; display: flex; gap: 12px; }
  .cover {
    width: 50px; height: 74px; object-fit: cover; border-radius: 3px; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .cover-fallback {
    width: 50px; height: 74px; border-radius: 3px; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-muted);
  }
  .result-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; }
  .result-author { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .result-desc { font-size: 12px; color: var(--text); opacity: 0.75; line-height: 1.5; margin: 6px 0; }
  .pill-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pill {
    display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px;
    font-size: 11.5px; border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; font-family: inherit;
  }
  .pill.active { border-color: var(--gold); background: rgba(201,162,75,0.14); color: var(--gold); }
  .pill.danger { color: var(--rust); margin-left: auto; }

  .row-btn {
    display: flex; width: 100%; text-align: left; background: none; border: none; padding: 0;
    cursor: pointer; color: inherit; font-family: inherit;
  }
  .spine-bar { width: 6px; flex-shrink: 0; }
  .row-main { padding: 12px; display: flex; gap: 12px; flex: 1; min-width: 0; align-items: center; }
  .row-thumb { width: 38px; height: 56px; object-fit: cover; border-radius: 3px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .row-thumb-fallback { width: 38px; height: 56px; border-radius: 3px; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-muted); }
  .row-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-author { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chevron { transition: transform 150ms; flex-shrink: 0; color: var(--text-muted); }
  .chevron.open { transform: rotate(180deg); }
  .row-detail { padding: 0 16px 16px 22px; display: none; }
  .row-detail.open { display: block; }
  .row-desc { font-size: 13px; color: var(--text); opacity: 0.85; line-height: 1.55; margin: 4px 0 14px; }

  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; padding: 6px 0; color: var(--text-muted); font-family: inherit;
  }
  .tab-btn.active { color: var(--gold); }
  .tab-btn span { font-size: 10.5px; font-weight: 500; }


  .scanner-overlay {
    position: absolute; inset: 0; background: rgba(10,15,13,0.97); z-index: 20;
    display: flex; flex-direction: column;
  }
  .scanner-close-row { display: flex; justify-content: flex-end; padding: 14px; }
  .scanner-close {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 8px;
    color: var(--text); cursor: pointer; display: flex;
  }
  .scanner-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .scanner-frame { position: relative; width: 100%; max-width: 320px; border-radius: 12px; overflow: hidden; border: 2px solid var(--gold); }
  .scanner-frame video { width: 100%; display: block; }
  .scanner-msg { text-align: center; color: var(--text-muted); max-width: 280px; }
  .scanner-msg p { font-size: 13.5px; line-height: 1.6; }
  .scanner-hint { text-align: center; color: var(--text-muted); font-size: 12.5px; padding-bottom: 24px; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
